<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body onload="feltolt()">
    <header class="col-12 bg-dark text-white fs-2">MRZ kódok érettségi feladat</header>

    <div class="col-12">
        <div class="row">
            <div class="col-6 m-3">
                <h1 class="fs-2">1. feladat</h1>
                <label for="file">Az állomány neve:</label>
                <select name="file" id="file" class="form-select mt-3 mb-3"></select>
                <button class="btn btn-dark" onclick="betolt()">Lekérés</button>
				<p id="kodKiir" class="bg-success rounded"></p>
            </div>



        </div>
    </div>


    <script>

		let MRZkod;

        function feltolt()
        {
			for(let i = 1; i < 4;i++)
			{	
				let option = document.createElement("option")
				option.innerHTML = `mrz${i}.txt`
				document.getElementById("file").appendChild(option)

			}

        }

		function betolt()
		{
			let txt = document.getElementById("file").value;

			fetch(txt)
			.then(x => x.text())
			.then(y => 
				{
					let sorok = y.split("\r\n");
					//console.log(MRZkod)


					let kod = sorok.join("");
					console.log(kod)

					document.getElementById("kodKiir").innerHTML = kod;

					let elsoSor = sorok[0];
					let masodikSor = sorok[1];
					
					MRZkod = {
						tipus : elsoSor.substr(0, 2),
						orszag : elsoSor.substr(2, 3),
						csaladiEsutonev : elsoSor.substr(5, 39),
						okmanySzam : masodikSor.substr(0, 9),
						okmanyszamEll : masodikSor.substr(9, 1),
						nemzetiseg : masodikSor.substr(10, 3),
						szuletesiIdo : masodikSor.substr(13,6),
						szuletesiidoEll : masodikSor.substr(19, 1),
						nem : masodikSor.substr(20, 1),
						ervenyesseg : masodikSor.substr(21, 6),
						ervenyessegEllenorzo : masodikSor.substr(27, 1),
						okmanytkiadovalaszthatoadat : masodikSor.substr(28, 14),
						okmanyValaszthatoEll : masodikSor.substr(42, 1),
						osszesitettEll : masodikSor.substr(43,1),
					}
					
					console.log(MRZkod)

				}
			)
		}

		function feladat2()
		{
			
		}

    </script>

</body>
</html>
